aid: ecoflow
name: EcoFlow
description: >-
  EcoFlow is a portable power and home energy-storage company known for its
  Delta and River portable power stations, PowerStream balcony micro-inverter,
  Power Kits, smart generators, whole-home backup systems and solar panels. For
  developers it operates the EcoFlow IoT Open Platform (developer.ecoflow.com),
  an HTTP + MQTT API that lets applications discover the EcoFlow devices bound to
  a user account, read live device telemetry ("quota" property values such as
  battery state of charge, input/output watts, temperatures and switch states),
  send device function commands, and stream real-time updates over MQTT. Access
  is authenticated with an accessKey / secretKey pair from the developer console
  and an HMAC-SHA256 request signature. The platform serves both a global/US
  region (api.ecoflow.com) and a separate Europe region (api-e.ecoflow.com),
  reflecting EcoFlow's strict per-region account separation.
